name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: CI only ever reads the repository. Any job needing more
# must opt in explicitly at the job level.
permissions:
  contents: read

# The pinned development version, kept in agreement with .bun-version by the
# "Verify Bun version pin" step below rather than by comment alone. The test
# matrix additionally covers the floor of the `engines.bun` range.
env:
  BUN_VERSION: "1.3.14"

# Superseded pushes to the same ref are wasted work; cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `.bun-version` and BUN_VERSION were previously asserted to match by comment
  # only, so nothing caught drift. This job enforces it in seconds, and covers
  # release.yml too, since that workflow pins the same value.
  version-pin:
    name: Verify Bun version pin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify .bun-version agrees with every pinned BUN_VERSION
        run: |
          set -euo pipefail
          pinned=$(tr -d '[:space:]' < .bun-version)
          echo "Pinned by .bun-version: $pinned"

          status=0
          for wf in .github/workflows/ci.yml .github/workflows/release.yml; do
            declared=$(grep -oE 'BUN_VERSION: "[^"]+"' "$wf" | head -1 | grep -oE '[0-9][^"]*')
            if [ -z "$declared" ]; then
              echo "::error file=$wf::no BUN_VERSION found"
              status=1
            elif [ "$declared" != "$pinned" ]; then
              echo "::error file=$wf::BUN_VERSION $declared disagrees with .bun-version $pinned"
              status=1
            else
              echo "OK: $wf pins $declared"
            fi
          done
          exit $status

  test:
    name: Test (bun ${{ matrix.bun }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One broken combination should not mask results from the others.
      fail-fast: false
      matrix:
        # `engines.bun` declares ">=1.3.0", so the floor of the supported range
        # must be tested, not just the pinned development version. The CLI does
        # file I/O, so all three runner OSes are exercised.
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: ["1.3.0", "1.3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Zero runtime dependencies keeps the blast radius small, but the check
      # costs seconds and a known-vulnerable devDependency still ships type
      # definitions into contributors' machines. Blocking is cheap here.
      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Format check
        run: bunx dprint check

      - name: Typecheck
        run: bun run typecheck

      - name: Build (declaration emit)
        run: bun run build

      - name: Verify build output
        # `shell: bash` so `test -f` works identically on the Windows runner,
        # where the default shell is PowerShell.
        shell: bash
        run: |
          test -f types/index.d.ts || (echo "types/index.d.ts not found" && exit 1)
          test -f types/links.d.ts || (echo "types/links.d.ts not found" && exit 1)

      - name: Verify package is importable by a Bun consumer
        # `shell: bash` gives the heredoc and `set -euo pipefail` consistent
        # semantics on Windows (Git Bash). A temp dir from `mktemp -d` replaces
        # the hardcoded /tmp path, which does not exist on Windows runners.
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          bun pm pack --destination "$workdir"
          tarball=$(find "$workdir" -maxdepth 1 -name 'bun-qr-*.tgz' | head -1)
          mkdir -p "$workdir/consumer" && cd "$workdir/consumer"
          echo '{"name":"consumer","type":"module"}' > package.json
          bun add "$tarball"
          cat > check.ts <<'TS'
          import encode_qr from 'bun-qr';
          import { encode_wifi } from 'bun-qr/links';
          const rows = (encode_qr('https://bun.sh', 'raw') as boolean[][]).length;
          if (rows < 21) throw new Error(`unexpected QR size: ${rows}`);
          if (!encode_wifi({ ssid: 'a', password: 'b' }).startsWith('WIFI:')) {
            throw new Error('links subpath export is broken');
          }
          console.log('package imports cleanly from a Bun consumer');
          TS
          bun run check.ts

      - name: Test with coverage
        run: bun test --coverage

      # Coverage is identical across the matrix; uploading from every leg would
      # collide on artifact name. Publish from the pinned Linux config only.
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.bun == env.BUN_VERSION
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  # Deliberately single-config: a benchmark is a measurement, and results from
  # different runner OSes or Bun versions are not comparable across runs.
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run benchmarks
        run: bun run bench | tee bench-${{ github.run_id }}.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ github.run_id }}
          path: bench-${{ github.run_id }}.txt
          retention-days: 90
