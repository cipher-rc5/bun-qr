name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Single source of truth for the Bun version. Must match `engines.bun`
# in package.json and .bun-version.
env:
  BUN_VERSION: "1.3.14"

jobs:
  test:
    name: Typecheck, Lint, Build, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bunx dprint check

      - name: Typecheck
        run: bun run typecheck

      - name: Build (declaration emit)
        run: bun run build

      - name: Verify build output
        run: |
          test -f types/index.d.ts || (echo "types/index.d.ts not found" && exit 1)
          test -f types/links.d.ts || (echo "types/links.d.ts not found" && exit 1)

      - name: Verify package is importable by a Bun consumer
        run: |
          set -euo pipefail
          bun pm pack --destination /tmp
          tarball=$(ls /tmp/bun-qr-*.tgz | head -1)
          mkdir -p /tmp/consumer && cd /tmp/consumer
          echo '{"name":"consumer","type":"module"}' > package.json
          bun add "$tarball"
          cat > check.ts <<'TS'
          import encode_qr from 'bun-qr';
          import { encode_wifi } from 'bun-qr/links';
          const rows = (encode_qr('https://bun.sh', 'raw') as boolean[][]).length;
          if (rows < 21) throw new Error(`unexpected QR size: ${rows}`);
          if (!encode_wifi({ ssid: 'a', password: 'b' }).startsWith('WIFI:')) {
            throw new Error('links subpath export is broken');
          }
          console.log('package imports cleanly from a Bun consumer');
          TS
          bun run check.ts

      - name: Test with coverage
        run: bun test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run benchmarks
        run: bun run bench | tee bench-${{ github.run_id }}.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ github.run_id }}
          path: bench-${{ github.run_id }}.txt
          retention-days: 90
