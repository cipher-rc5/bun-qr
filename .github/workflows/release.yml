name: Release

on:
  push:
    tags:
      - "v*"

# Must match .bun-version and ci.yml. Enforced by the "Verify Bun version pin"
# job in ci.yml, which checks this file too.
env:
  BUN_VERSION: "1.3.14"

# Never cancel a release mid-flight: an interrupted run can leave a published
# npm version with no matching GitHub release and no uploaded artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Re-run every gate CI enforces. A tag must not be able to publish
      # code that CI would have rejected.
      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Format check
        run: bunx dprint check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build (declaration emit)
        run: bun run build

      - name: Verify build output
        run: |
          test -f types/index.d.ts || (echo "types/index.d.ts not found" && exit 1)
          test -f types/links.d.ts || (echo "types/links.d.ts not found" && exit 1)

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(bun --print "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Pack and generate checksums
        run: |
          set -euo pipefail
          bun pm pack --destination dist-artifacts
          cd dist-artifacts
          sha256sum ./*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # @cyclonedx/cyclonedx-npm shells out to npm and inspects the npm binary
      # path, so it needs a real Node/npm toolchain. Verified locally against
      # Bun 1.3.14: `bunx --bun` segfaults loading the native libxmljs2 module,
      # and plain `bunx` aborts with `Unexpected npmJsPath ".../bin/bun"`.
      # This is also why the previous `|| echo` fallback never produced an SBOM:
      # it was masking a hard failure on every release. Node is used for this
      # step only; bun remains the package manager everywhere else.
      - name: Setup Node (for SBOM generation only)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # No `|| echo` fallback. An SBOM is a compliance artifact that consumers
      # and downstream scanners rely on; silently shipping a release without one
      # is worse than not shipping the release. A failure here is a real defect
      # and should be fixed and re-tagged rather than swallowed. The output is
      # also validated, since a generator can exit 0 while writing nothing
      # useful — which is precisely the failure mode that went unnoticed before.
      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON \
            --output-file dist-artifacts/sbom.cdx.json
          test -s dist-artifacts/sbom.cdx.json \
            || (echo "SBOM file is empty" && exit 1)
          node -e "
            const b = JSON.parse(require('fs').readFileSync('dist-artifacts/sbom.cdx.json','utf8'));
            if (b.bomFormat !== 'CycloneDX') throw new Error('not a CycloneDX document');
            console.log('SBOM OK: spec ' + b.specVersion + ', ' + (b.components || []).length + ' components');
          "

      # `bun publish` does NOT support --provenance as of Bun 1.3.14: the flag is
      # absent from `bun publish --help` and the official docs, and Bun's argument
      # parser silently ignores unknown flags rather than erroring — so passing it
      # to `bun publish` would produce a green release with no attestation at all.
      # Tracking issue: https://github.com/oven-sh/bun/issues/15601
      #
      # npm's own CLI is therefore used for this one step (via bunx, so no global
      # npm install is required). It consumes the id-token: write permission
      # granted above to sign the published tarball, giving consumers a verifiable
      # cryptographic link back to this commit and workflow. Revisit and switch to
      # `bun publish --provenance` once Bun implements it.
      - name: Publish to npm with provenance
        run: |
          set -euo pipefail
          # This project does not use actions/setup-node, so the .npmrc that
          # normally resolves ${NODE_AUTH_TOKEN} does not exist. Write it here.
          # The single quotes are deliberate: npm itself expands the
          # ${NODE_AUTH_TOKEN} placeholder at read time, so the secret is never
          # written to disk in cleartext. Do not "fix" this to double quotes.
          # shellcheck disable=SC2016
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"
          # npm >=9.5.0 is required for provenance; the version is pinned so the
          # release is reproducible instead of tracking whatever `latest` is today.
          # --ignore-scripts skips `prepublishOnly`, whose gates (fmt/typecheck/test/build)
          # this job has already run explicitly above. The hook stays in package.json so a
          # manual `bun publish` is still gated; there is just no reason to pay for it twice.
          bunx --bun npm@12.0.2 publish --access public --tag latest --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Remove npm credentials
        if: always()
        run: rm -f "$HOME/.npmrc"

      - name: Create GitHub Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true
            });
            const dir = 'dist-artifacts';
            for (const file of fs.readdirSync(dir)) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: file,
                data: fs.readFileSync(path.join(dir, file))
              });
            }
