name: Release

on:
  push:
    tags:
      - "v*"

# Must match .bun-version and ci.yml. Enforced by the "Verify Bun version pin"
# job in ci.yml, which checks this file too.
env:
  BUN_VERSION: "1.3.14"

# Never cancel a release mid-flight: an interrupted run can leave a published
# npm version with no matching GitHub release and no uploaded artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Re-run every gate CI enforces. A tag must not be able to publish
      # code that CI would have rejected.
      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Format check
        run: bunx dprint check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build (declaration emit)
        run: bun run build

      - name: Verify build output
        run: |
          test -f types/index.d.ts || (echo "types/index.d.ts not found" && exit 1)
          test -f types/links.d.ts || (echo "types/links.d.ts not found" && exit 1)

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(bun --print "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Pack and generate checksums
        run: |
          set -euo pipefail
          bun pm pack --destination dist-artifacts
          cd dist-artifacts
          sha256sum ./*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Generated by `scripts/sbom.ts` from bun.lock rather than by
      # @cyclonedx/cyclonedx-npm. That generator shells out to npm and inspects the
      # npm binary path, so it cannot run under Bun — verified against 1.3.14:
      # `bunx --bun` segfaults loading the native libxmljs2 module, and plain `bunx`
      # aborts with `Unexpected npmJsPath ".../bin/bun"`. This is also why the
      # previous `|| echo` fallback never produced an SBOM: it masked a hard failure
      # on every release. The npm-based tools additionally inventory the build host's
      # Node install rather than the artifact being published, which misrepresents a
      # package that ships zero runtime dependencies.
      #
      # No `|| echo` fallback. An SBOM is a compliance artifact that consumers and
      # downstream scanners rely on; silently shipping a release without one is worse
      # than not shipping the release. The output is also validated, since a generator
      # can exit 0 while writing nothing useful — precisely the failure mode that went
      # unnoticed before.
      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          bun run scripts/sbom.ts dist-artifacts/sbom.cdx.json
          test -s dist-artifacts/sbom.cdx.json \
            || (echo "SBOM file is empty" && exit 1)
          bun -e "
            const b = await Bun.file('dist-artifacts/sbom.cdx.json').json();
            if (b.bomFormat !== 'CycloneDX') throw new Error('not a CycloneDX document');
            if (!Array.isArray(b.components)) throw new Error('SBOM has no components array');
            console.log('SBOM OK: spec ' + b.specVersion + ', ' + b.components.length + ' components');
          "

      # Published with `bun publish`, keeping the toolchain Bun-only end to end.
      #
      # This forgoes npm provenance attestation: `bun publish` has no --provenance
      # flag as of Bun 1.3.14 (https://github.com/oven-sh/bun/issues/15601), and Bun
      # silently ignores unknown flags rather than erroring, so passing it anyway
      # would yield a green release with no attestation and no warning — worse than
      # not claiming it. Integrity is instead evidenced by the SHA256SUMS.txt and
      # SBOM attached to the GitHub Release, and by the gates re-run above. Switch to
      # `bun publish --provenance` once Bun implements it.
      #
      # --ignore-scripts skips `prepublishOnly`, whose gates (fmt/typecheck/test/build)
      # this job already ran explicitly above. The hook stays in package.json so a
      # manual `bun publish` is still gated; there is no reason to pay for it twice.
      # NPM_CONFIG_TOKEN is the variable `bun publish` reads; verified empirically
      # against Bun 1.3.14 with an isolated HOME and no .npmrc — it is the only one
      # that authenticates. BUN_AUTH_TOKEN is not consulted and was removed rather
      # than kept as a decorative fallback.
      - name: Publish to npm
        run: bun publish --access public --tag latest --ignore-scripts
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true
            });
            const dir = 'dist-artifacts';
            for (const file of fs.readdirSync(dir)) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: file,
                data: fs.readFileSync(path.join(dir, file))
              });
            }
