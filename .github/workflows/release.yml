name: Release

on:
  push:
    tags:
      - "v*"

# Must match .bun-version and ci.yml. Enforced by the "Verify Bun version pin"
# job in ci.yml, which checks this file too.
env:
  BUN_VERSION: "1.4.2"

# Never cancel a release mid-flight: an interrupted run can leave a published
# npm version with no matching GitHub release and no uploaded artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify runtime, engine minimum, workflow pins and matrix
        run: bun run verify:toolchain

      # Re-run the validation gates CI enforces. A tag must not be able to publish
      # code that CI would have rejected.
      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run coverage

      - name: Verify coverage report
        run: test -s coverage/lcov.info

      - name: Build (declaration emit)
        run: bun run build

      - name: Verify build output
        run: |
          test -f types/index.d.ts || (echo "types/index.d.ts not found" && exit 1)
          test -f types/links.d.ts || (echo "types/links.d.ts not found" && exit 1)

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(bun --print "(await Bun.file('package.json').json()).version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Pack and generate checksums
        run: |
          set -euo pipefail
          bun pm pack --destination dist-artifacts
          cd dist-artifacts
          sha256sum ./*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Generated by `scripts/sbom.ts` from bun.lock rather than by
      # @cyclonedx/cyclonedx-npm. That generator shells out to npm and inspects the
      # npm binary path, so it cannot run under Bun — verified against 1.3.14:
      # `bunx --bun` segfaults loading the native libxmljs2 module, and plain `bunx`
      # aborts with `Unexpected npmJsPath ".../bin/bun"`. This is also why the
      # previous `|| echo` fallback never produced an SBOM: it masked a hard failure
      # on every release. The npm-based tools additionally inventory the build host's
      # Node install rather than the artifact being published, which misrepresents a
      # package that ships zero runtime dependencies.
      #
      # No `|| echo` fallback. An SBOM is a compliance artifact that consumers and
      # downstream scanners rely on; silently shipping a release without one is worse
      # than not shipping the release. The output is also validated, since a generator
      # can exit 0 while writing nothing useful — precisely the failure mode that went
      # unnoticed before.
      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          bun run scripts/sbom.ts dist-artifacts/sbom.cdx.json
          test -s dist-artifacts/sbom.cdx.json \
            || (echo "SBOM file is empty" && exit 1)
          bun -e "
            const b = await Bun.file('dist-artifacts/sbom.cdx.json').json();
            if (b.bomFormat !== 'CycloneDX') throw new Error('not a CycloneDX document');
            if (!Array.isArray(b.components)) throw new Error('SBOM has no components array');
            console.log('SBOM OK: spec ' + b.specVersion + ', ' + b.components.length + ' components');
          "

      - name: Verify the release tarball imports and consumer types
        run: bun run verify:package dist-artifacts/*.tgz

      - name: Attest release tarball provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ github.workspace }}/dist-artifacts/*.tgz"
          create-storage-record: false

      - name: Preserve provenance bundle for consumers
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" dist-artifacts/provenance.sigstore.json

      # Publish the exact verified and attested bytes, without repacking.
      # Manual publishing uses prepublishOnly; all those gates ran above here.
      # GitHub/Sigstore provenance is separate from npm registry provenance.
      - name: Publish to npm
        run: |
          set -euo pipefail
          tarballs=(dist-artifacts/*.tgz)
          test "${#tarballs[@]}" -eq 1
          bun publish "${tarballs[0]}" --access public --tag latest --ignore-scripts
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist-artifacts/* \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
