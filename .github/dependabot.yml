version: 2

updates:
  # Every action in this repository is pinned to an immutable commit SHA, which
  # is correct for supply-chain safety but means nothing will ever propose an
  # upgrade. Dependabot rewrites both the SHA and the trailing `# v4` comment,
  # so pinning stays intact and the pins stop going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      # Action bumps are near-always low risk and are gated by CI; reviewing one
      # PR a week beats reviewing five.
      actions:
        patterns:
          - "*"

  # The package has zero runtime dependencies, so this covers devDependencies
  # (@types/bun, typescript) only. Both are exact-pinned in package.json.
  #
  # `npm` here is Dependabot's identifier for the JavaScript registry ecosystem,
  # not a package manager choice: it is the value that makes Dependabot read
  # `bun.lock`. There is no `bun` ecosystem value. Nothing in this repository
  # executes npm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
    ignore:
      # @types/bun tracks the Bun runtime version pinned in .bun-version, and
      # bumping it independently would break that agreement. It is upgraded
      # deliberately alongside a Bun upgrade.
      - dependency-name: "@types/bun"
